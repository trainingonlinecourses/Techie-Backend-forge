name: Keep Render backend awake

# Render free web services sleep after ~15 minutes of inbound-idle traffic and
# take ~30-60s to wake, which makes the first request after a quiet period slow
# (or fail the browser's initial calls). Pinging every 5 minutes keeps the
# instance warm. This repo is public, so GitHub Actions scheduled runs are free.
# For extra safety you can add a second pinger on cron-job.org pointing at
# the same URL — see README "Render keep-alive" section.
on:
  schedule:
    # GitHub throttles scheduled workflows under load — a single */5 cron ran
    # hours apart in practice (19:10 → 13:58 → 07:06), letting Render sleep and
    # making the site look broken to first visitors. Several offset crons give
    # more chances per hour; whichever slots survive still keep the instance warm.
    - cron: '2,17,32,47 * * * *'
    - cron: '7,22,37,52 * * * *'
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch: {}

# A stalled keep-alive run must never block the next one.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Wake Render
    runs-on: ubuntu-latest
    steps:
      - name: Hit health endpoint
        run: |
          echo "Pinging Render backend at $(date -u)..."
          # --fail-with-body: non-2xx fails the step but still prints the response,
          # so the Actions log shows WHAT the health endpoint returned, not just the code.
          curl -sS --fail-with-body --retry 3 --retry-delay 5 --max-time 60 \
            https://backendforge-academy-api-bef2.onrender.com/actuator/health \
            && echo "✓ health OK"

      - name: Warm the content cache
        run: |
          curl -fsS --retry 2 --retry-delay 3 --max-time 30 \
            https://backendforge-academy-api-bef2.onrender.com/api/content/stats \
            && echo "✓ content cache warm"

      - name: Log result
        if: always()
        run: |
          echo "Keep-alive ping completed at $(date -u)"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_number }}"
