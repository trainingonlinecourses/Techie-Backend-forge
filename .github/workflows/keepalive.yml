name: Keep Render backend awake

# This workflow is the production uptime guard. It does two jobs:
#
#  1. KEEPS WARM — Render free web services sleep after ~15 minutes of idle
#     traffic and take ~30-60s to wake, so a periodic check keeps the instance
#     hot and the first visitor's request fast.
#
#  2. SELF-HEALS — if the API stops answering, scripts/uptime-guard.mjs
#     diagnoses the failure and automatically redeploys ONLY the cases a
#     redeploy genuinely fixes (a wedged Render container, a dead Vercel
#     frontend). Cases it cannot fix — a paused Supabase project, an app that
#     is up but erroring — are reported with exact manual steps instead of
#     being retried forever.
#
# Auto-recovery needs one secret: RENDER_API_KEY (see docs/ops-production-monitoring.md).
# VERCEL_TOKEN is optional and only used to redeploy the frontend.
#
# This repo is public, so scheduled GitHub Actions runs are free.
on:
  schedule:
    # GitHub throttles scheduled workflows under load — a single */5 cron ran
    # hours apart in practice (19:10 → 13:58 → 07:06), letting Render sleep and
    # making the site look broken to first visitors. Several offset crons give
    # more chances per hour; whichever slots survive still keep the instance warm.
    - cron: '2,17,32,47 * * * *'
    - cron: '7,22,37,52 * * * *'
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch: {}

# A stalled keep-alive run must never block the next one.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  guard:
    name: Uptime guard (check + auto-recover)
    runs-on: ubuntu-latest
    steps:
      # Checkout is required now: the guard script lives in the repo. (This is
      # also what the old `gh workflow run -R` step was missing a repo for.)
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Diagnose, and redeploy ONLY what a redeploy can fix (a wedged boot).
      # A wedged container or a dead frontend is recovered automatically; a
      # paused database or an erroring app is reported with manual steps,
      # because retrying those just burns builds and hides the real cause.
      - name: Check production and recover if possible
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Cooldown lives in the Actions cache: without it, every throttled
          # cron tick would queue another Render build during a real outage.
          GUARD_STATE_DIR: ${{ runner.temp }}/guard
        run: node scripts/uptime-guard.mjs

      - name: Log result
        if: always()
        run: |
          echo "Uptime guard completed at $(date -u)"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_number }}"

      # A failing guard re-checks shortly rather than waiting for the next cron
      # slot (which GitHub throttles to ~every 2-4h in practice). That is what
      # let the backend sit dark for weeks: failures were recorded but nobody
      # re-checked. workflow_dispatch runs are never throttled.
      - name: Re-check shortly after a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # -R is REQUIRED: gh infers the repository from the local git
          # checkout, and without it every call fails with
          # "fatal: not a git repository" — the loop silently did nothing.
          for i in 1 2; do
            sleep 90
            if gh workflow run keepalive.yml --ref main -R "$REPO"; then
              echo "✓ re-triggered uptime guard (attempt $i)"
              break
            fi
            echo "re-trigger attempt $i failed (API hiccup), retrying..."
          done
