# CI — runs on every push so broken code is caught before it can be deployed.
# Three independent jobs run in parallel:
#   content  — curriculum integrity (module order, lesson slugs, fences, references)
#   backend  — Spring Boot unit/integration tests (mvn test, Java 21)
#   frontend — Vite production build of the React app
# All must pass for the commit to be considered green; deployments
# (Render for the API, Vercel for the frontend) are gated on CI via
# required status checks on main.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Don't burn minutes re-testing outdated commits — cancel the older run of the
# same branch/PR when a new one starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content integrity (curriculum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify curriculum integrity
        run: node scripts/verify-content.mjs

      - name: JS unit suites (prereq gating, band recommendation, next-up)
        run: |
          node scripts/test-prereqs.mjs
          node scripts/test-recommend-band.mjs
          node scripts/test-next-up.mjs

  backend:
    name: Backend tests (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B --no-transfer-progress test

  frontend:
    name: Frontend build (vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  e2e:
    name: E2E (register → login → lesson → persistence)
    runs-on: ubuntu-latest
    needs: [content]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      # Package the real backend (skipping unit tests — the backend job runs
      # them), then boot it with seeded demo content on :8080. The Vite dev
      # server (Playwright webServer) proxies /api to it.
      - name: Package and boot local backend
        run: |
          cd ../backend
          mvn -B --no-transfer-progress package -DskipTests
          nohup java -jar target/academy-api-*.jar --server.port=8080 --spring.profiles.active=local > ../.freebuff/backend-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/content/stats > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/api/content/stats

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
