spring:
  datasource:
    url: jdbc:h2:mem:kafkademo;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  kafka:
    # @EmbeddedKafka sets this system property to the in-process broker address.
    bootstrap-servers: ${spring.embedded.kafka.brokers}

app:
  outbox:
    poll-ms: 300        # fast relay ticks so tests don't wait
    batch-size: 50
