<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BackendForge Academy — Java &amp; Spring End to End</title>
  <meta name="description" content="Full-stack Spring learning platform: Java, Spring Core, Spring Boot, Spring Security, Spring AI — explanations, code, official docs and projects." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <script>
    // Apply the saved theme before first paint — React would set it only after
    // mounting, leaving a dark flash for light-theme visitors on every load.
    try {
      var t = localStorage.getItem('bf-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* storage unavailable — default theme applies */ }
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
