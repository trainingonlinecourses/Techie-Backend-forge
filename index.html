<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackendForge — Complete Production Java Academy</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/500.css">
<style>
:root{--bg:#0a0e14;--bg2:#0d1219;--surface:#10161f;--surface2:#131b26;--line:#1e2836;--line2:#2b3a4f;--txt:#e6edf3;--mut:#8b98a9;--dim:#5c6b7f;--amber:#f5a623;--amber2:#ffb224;--green:#6fce6f;--blue:#4cc2ff;--red:#ff6b6b;--purple:#bb9af7;--teal:#2ac3de;--disp:'Space Grotesk',sans-serif;--body:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;--hh:60px;--sw:292px;--tw:224px}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:15px;line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 420px at 85% -10%,rgba(245,166,35,.07),transparent 60%),radial-gradient(700px 380px at -10% 20%,rgba(76,194,255,.05),transparent 60%)}
::selection{background:rgba(245,166,35,.35)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#243144;border-radius:6px;border:2px solid var(--bg)}
code.inline{font-family:var(--mono);font-size:.86em;background:#182231;color:#ffd58a;border:1px solid #263349;border-radius:5px;padding:1px 6px}
header{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:60;display:flex;align-items:center;gap:16px;padding:0 20px;background:rgba(10,14,20,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.burger{display:none;background:none;border:1px solid var(--line2);border-radius:8px;color:var(--txt);width:38px;height:38px;cursor:pointer;font-size:16px;flex:0 0 38px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;flex:0 0 auto}
.logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1a2332,#0e1520);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:var(--amber);font-size:14px;box-shadow:0 0 18px rgba(245,166,35,.18)}
.logo .name{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.06em;white-space:nowrap}.logo .name b{color:var(--amber)}
.logo .tag{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.18em;display:block;margin-top:-2px}
.searchwrap{flex:1;max-width:520px;margin:0 auto;position:relative;min-width:0}
.searchwrap input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-family:var(--mono);font-size:12.5px;padding:9px 14px 9px 36px;outline:none;transition:border-color .2s,box-shadow .2s}
.searchwrap input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,166,35,.12)}
.searchwrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px}
.searchwrap kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.progresspill{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;flex:0 0 auto}
.progresspill .txt{font-family:var(--mono);font-size:11px;color:var(--mut);white-space:nowrap}.progresspill .txt b{color:var(--amber)}
.ring{width:26px;height:26px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3.4}.ring .bgc{stroke:#223046}
.ring .fgc{stroke:var(--amber);stroke-linecap:round;stroke-dasharray:75.4;stroke-dashoffset:75.4;transition:stroke-dashoffset .8s}
.layout{display:flex;padding-top:var(--hh);position:relative;z-index:1;min-width:0}
aside#sidebar{width:var(--sw);flex:0 0 var(--sw);position:sticky;top:var(--hh);height:calc(100vh - var(--hh));overflow-y:auto;border-right:1px solid var(--line);padding:18px 14px 40px;background:rgba(13,18,25,.5)}
aside#toc{width:var(--tw);flex:0 0 var(--tw);position:sticky;top:var(--hh);height:calc(100vh - var(--hh));overflow-y:auto;padding:26px 14px 26px 0;display:none}
@media(min-width:1360px){aside#toc{display:block}}
main{flex:1;min-width:0;padding:34px clamp(18px,4vw,52px) 90px;max-width:1060px}
.navgroup{margin:18px 0 6px;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--dim);padding:0 10px}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--mut);border:1px solid transparent;transition:all .18s;margin-bottom:2px}
.navitem:hover{background:var(--surface);color:var(--txt);transform:translateX(2px)}
.navitem.active{background:var(--surface2);color:var(--txt);border-color:var(--line2);box-shadow:inset 3px 0 0 var(--amber)}
.navitem .num{font-family:var(--mono);font-size:10px;color:var(--dim);width:24px;flex:0 0 24px}
.navitem .ttl{font-size:13px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navitem .chk{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:9px;color:#08110a;flex:0 0 15px}
.navitem.done .chk{background:var(--green);border-color:var(--green)}.navitem.done .ttl{color:#9fb3c8}
.navitem mark{background:none;color:var(--amber);text-decoration:underline}
.navcount{font-family:var(--mono);font-size:10px;color:var(--dim);padding:6px 10px}
.toc-title{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--dim);margin-bottom:12px}
.toc a{display:block;font-size:12px;color:var(--dim);padding:5px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--txt)}.toc a.on{color:var(--amber);border-left-color:var(--amber);text-decoration:none}
.crumbs{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumbs .sep{color:var(--line2)}
.pagehead{position:relative;margin-bottom:26px}
.pnum{position:absolute;right:0;top:-14px;font-family:var(--disp);font-weight:700;font-size:clamp(56px,9vw,110px);line-height:1;color:transparent;-webkit-text-stroke:1px #223046;user-select:none;pointer-events:none}
h1.ptitle{font-family:var(--disp);font-weight:700;font-size:clamp(24px,4vw,38px);letter-spacing:-.01em;margin:6px 0 10px}
.meta-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;border:1px solid var(--line2);border-radius:999px;padding:4px 11px;color:var(--mut)}
.chip.amber{color:var(--amber);border-color:rgba(245,166,35,.4)}.chip.green{color:var(--green);border-color:rgba(111,206,111,.4)}.chip.blue{color:var(--blue);border-color:rgba(76,194,255,.4)}
.statusbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:10px 14px;margin:14px 0 18px;font-size:12.5px;color:var(--mut)}
.statusbar b{color:var(--txt)}
.topics{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}
.topics span{font-family:var(--mono);font-size:10.5px;background:#141d2b;border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:#9fb3c8}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.04em;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid transparent;transition:all .2s}
.btn.primary{background:var(--amber);color:#141005}.btn.primary:hover{background:var(--amber2);transform:translateY(-1px);box-shadow:0 8px 22px rgba(245,166,35,.25)}
.btn.ghost{background:transparent;color:var(--mut);border-color:var(--line2)}.btn.ghost:hover{color:var(--txt);border-color:var(--mut)}
.btn.donebtn{background:rgba(111,206,111,.12);color:var(--green);border-color:rgba(111,206,111,.45)}
.head-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.block{margin:26px 0;animation:rise .5s both;min-width:0}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2.sec{font-family:var(--disp);font-weight:700;font-size:21px;margin:38px 0 12px;padding-left:14px;border-left:4px solid var(--amber);scroll-margin-top:80px}
.block p{color:#b9c6d6;margin:8px 0;max-width:82ch}.block p strong{color:var(--txt)}
.block ul,.block ol{margin:8px 0 8px 22px;color:#b9c6d6}.block li{margin:5px 0}.block li::marker{color:var(--amber)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
.tblwrap .ttitle{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--dim);padding:10px 14px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#0e141d}
td{padding:9px 14px;border-bottom:1px solid var(--line);color:#b9c6d6;vertical-align:top}
tr:last-child td{border-bottom:none}tbody tr:hover{background:#141c29}
.call{border-radius:12px;padding:14px 16px;border:1px solid;margin:16px 0}
.call .ct{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.05em;margin-bottom:6px}
.call p,.call li{font-size:13.5px}
.call.prod{background:rgba(245,166,35,.06);border-color:rgba(245,166,35,.3)}.call.prod .ct{color:var(--amber)}
.call.warn{background:rgba(255,107,107,.06);border-color:rgba(255,107,107,.3)}.call.warn .ct{color:var(--red)}
.call.tip{background:rgba(111,206,111,.06);border-color:rgba(111,206,111,.3)}.call.tip .ct{color:var(--green)}
.call.info{background:rgba(76,194,255,.06);border-color:rgba(76,194,255,.3)}.call.info .ct{color:var(--blue)}
.call.dbg{background:rgba(187,154,247,.06);border-color:rgba(187,154,247,.3)}.call.dbg .ct{color:var(--purple)}
.codeblock{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2);margin:16px 0}
.codeblock figcaption{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%}
.dots i:nth-child(1){background:#ff5f56}.dots i:nth-child(2){background:#ffbd2e}.dots i:nth-child(3){background:#27c93f}
.fname{font-family:var(--mono);font-size:11.5px;color:#9fb3c8;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(42,195,222,.35);border-radius:5px;padding:2px 7px;flex:0 0 auto}
.copybtn{font-family:var(--mono);font-size:10px;color:var(--mut);background:none;border:1px solid var(--line2);border-radius:6px;padding:3px 9px;cursor:pointer;flex:0 0 auto}
.copybtn:hover{color:var(--amber);border-color:var(--amber)}.copybtn.ok{color:var(--green);border-color:var(--green)}
.codeblock pre{overflow-x:auto;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.62;-webkit-overflow-scrolling:touch}
.hljs{background:transparent;color:#dbe4ee}
.hljs-comment,.hljs-quote{color:#5c6b7f;font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal{color:#ff9e64}
.hljs-string,.hljs-regexp,.hljs-addition{color:#9ece6a}
.hljs-number,.hljs-symbol{color:#e0af68}
.hljs-title,.hljs-title.function_,.hljs-section{color:#7aa2f7}
.hljs-title.class_,.hljs-type{color:#e5c07b}
.hljs-meta,.hljs-attr{color:#bb9af7}
.hljs-variable,.hljs-template-variable,.hljs-deletion{color:#f7768e}
.hljs-attribute,.hljs-name{color:#7dcfff}
.hljs-built_in{color:#2ac3de}
details.qa{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:8px 0;overflow:hidden}
details.qa[open]{border-color:var(--line2)}
details.qa summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13.5px;color:#cfe0f2;list-style:none;display:flex;gap:10px;align-items:baseline}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:"Q";font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid rgba(245,166,35,.4);border-radius:5px;padding:1px 6px;flex:0 0 auto}
details.qa summary::after{content:"+";margin-left:auto;color:var(--dim);font-family:var(--mono)}
details.qa[open] summary::after{content:"–"}
details.qa .ans{padding:0 16px 14px 40px;font-size:13.5px;color:#b9c6d6}
.diagram{width:100%;height:auto;display:block;background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.diagram .zone{fill:#0e141d;stroke:#233042;stroke-dasharray:6 4}
.diagram .node{fill:#131c28;stroke:#2b3a4f;stroke-width:1.2}
.diagram .na{stroke:var(--amber)}.diagram .ng{stroke:var(--green)}.diagram .nb{stroke:var(--blue)}.diagram .nr{stroke:var(--red)}.diagram .np{stroke:var(--purple)}
.diagram .lbl{fill:#e6edf3;font:600 12px 'Space Grotesk',sans-serif}
.diagram .sub{fill:#8b98a9;font:400 9.5px 'JetBrains Mono',monospace}
.diagram .zt{fill:#5c6b7f;font:500 9.5px 'JetBrains Mono',monospace;letter-spacing:.18em}
.diagram .edge{stroke:#3a4a61;stroke-width:1.3;fill:none}
.diagram .eh{stroke:var(--amber)}.diagram .eg{stroke:var(--green)}.diagram .er{stroke:var(--red);stroke-dasharray:5 4}
.diagram .numc{fill:var(--amber)}.diagram .numt{fill:#141005;font:700 10px 'JetBrains Mono',monospace}
.pn{display:flex;gap:14px;margin-top:48px}
.pn button{flex:1;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;color:var(--mut);min-width:0}
.pn button:hover{border-color:var(--amber);transform:translateY(-2px)}
.pn .dir{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);display:block;margin-bottom:4px}
.pn .nm{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--txt)}
.pn button.next{text-align:right}
.hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:26px;background:#0c1320}
.hero .bgimg{position:absolute;inset:0;background:linear-gradient(120deg,#0d1524,#101b2e 45%,#0c1626),radial-gradient(600px 300px at 70% 30%,rgba(245,166,35,.12),transparent 60%);opacity:.9}
.hero .veil{position:absolute;inset:0;background:linear-gradient(100deg,rgba(10,14,20,.94) 30%,rgba(10,14,20,.55) 70%,rgba(10,14,20,.35))}
.hero .inner{position:relative;padding:clamp(26px,5vw,58px)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--amber);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.kicker .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(111,206,111,.6);animation:pulse 2s infinite;flex:0 0 8px}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(111,206,111,0)}100%{box-shadow:0 0 0 0 rgba(111,206,111,0)}}
.hero h1{font-family:var(--disp);font-weight:700;font-size:clamp(27px,5.2vw,52px);line-height:1.08;letter-spacing:-.02em;max-width:17ch}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero .lede{color:#b9c6d6;max-width:60ch;margin:16px 0 22px;font-size:15px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:30px}
.stat .v{font-family:var(--disp);font-weight:700;font-size:26px;color:var(--txt)}.stat .v b{color:var(--amber)}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim)}
.marquee{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:22px 0;position:relative}
.marquee::before,.marquee::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.marquee::before{left:0;background:linear-gradient(90deg,var(--surface),transparent)}
.marquee::after{right:0;background:linear-gradient(-90deg,var(--surface),transparent)}
.mq-track{display:flex;gap:34px;width:max-content;padding:11px 0;animation:mq 42s linear infinite}
.marquee:hover .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq-track span{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--mut);white-space:nowrap}
.mq-track span b{color:var(--amber)}
.depthgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0}
.depthgrid div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:11px;color:var(--mut)}
.depthgrid div:hover{border-color:var(--amber);color:var(--amber);transform:translateY(-2px)}
.depthgrid div i{color:var(--green);font-style:normal;margin-right:6px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.modcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;overflow:hidden;transition:all .25s;animation:rise .5s both}
.modcard::after{content:attr(data-num);position:absolute;right:10px;top:2px;font-family:var(--disp);font-weight:700;font-size:52px;color:transparent;-webkit-text-stroke:1px #1e2a3c}
.modcard:hover{border-color:var(--amber);transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.modcard .g{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--dim)}
.modcard h3{font-family:var(--disp);font-size:16px;margin:8px 0 6px}
.modcard p{font-size:12px;color:var(--mut);min-height:34px}
.modcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.modcard .state{padding:3px 9px;border-radius:999px;border:1px solid var(--line2)}
.modcard .state.done{color:var(--green);border-color:rgba(111,206,111,.4)}
.modcard .state.todo{color:var(--amber);border-color:rgba(245,166,35,.4)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.bcol{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;border-top:3px solid var(--line2);min-width:0}
.bcol h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;margin-bottom:12px;color:var(--dim)}
.bcol ul{list-style:none}
.bcol li{font-size:12.5px;color:var(--mut);padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:baseline}
.bcol li:last-child{border-bottom:none}
.bcol.ok{border-top-color:var(--green)}.bcol.ok li::before{content:"✓";color:var(--green);font-size:11px}
.bcol.next{border-top-color:var(--amber)}.bcol.next li::before{content:"→";color:var(--amber);font-size:11px}
.bcol.miss{border-top-color:var(--red)}.bcol.miss li::before{content:"!";color:var(--red);font-size:11px;font-weight:700}
.bcol.add{border-top-color:var(--blue)}.bcol.add li::before{content:"+";color:var(--blue);font-size:11px;font-weight:700}
.bcol li a{cursor:pointer;color:var(--blue)}
.projgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:16px 0}
.projcard{border-radius:16px;border:1px solid var(--line);padding:22px;cursor:pointer;transition:all .25s;min-width:0}
.projcard:hover{transform:translateY(-4px)}
.projcard.p1{background:linear-gradient(140deg,rgba(245,166,35,.1),var(--surface) 55%)}
.projcard.p2{background:linear-gradient(140deg,rgba(76,194,255,.1),var(--surface) 55%)}
.projcard h3{font-family:var(--disp);font-size:20px;margin-bottom:8px}
.projcard p{font-size:13px;color:var(--mut)}
.projcard .svc{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

package com.bank.core;

import java.math.BigDecimal;
import java.util.Objects;

/** IMMUTABLE value object. */
record Money(BigDecimal amount, String currency) {
    Money {
        Objects.requireNonNull(currency, "currency");
        if (amount == null || amount.signum() < 0)
            throw new IllegalArgumentException("amount must be >= 0");
    }
    Money add(Money o) {
        if (!currency.equals(o.currency)) throw new IllegalArgumentException("currency mismatch");
        return new Money(amount.add(o.amount), currency);
    }
}

class InsufficientFundsException extends RuntimeException {
    InsufficientFundsException(String iban) { super("insufficient funds on " + iban); }
}

/** ENTITY: identity + encapsulated invariants. Behaviour over getters/setters. */
public class Account {
    private final String iban;          // final field: set once
    private Money balance;              // private: no outside mutation

    public Account(String iban, Money opening) {
        this.iban = Objects.requireNonNull(iban);
        this.balance = opening;
    }
    public void debit(Money m) {
        if (balance.amount().compareTo(m.amount()) < 0) throw new InsufficientFundsException(iban);
        balance = new Money(balance.amount().subtract(m.amount()), balance.currency());
    }
    public void credit(Money m) { balance = balance.add(m); }
    public Money balance() { return balance; }
    public String iban()   { return iban; }
}

// POLYMORPHISM: one reference type, many behaviours
interface FeePolicy { Money fee(Money amount); }
record StandardFee() implements FeePolicy {
    public Money fee(Money a) { return new Money(a.amount().multiply(new BigDecimal("0.01")), a.currency()); }
}
record VipFee() implements FeePolicy {
    public Money fee(Money a) { return new Money(BigDecimal.ZERO, a.currency()); }
}

public final class CustomerId {
    private final String value;

    public CustomerId(String value) {
        if (value == null || value.isBlank())
            throw new IllegalArgumentException("customerId must not be blank");
        this.value = value;
    }
    @Override public boolean equals(Object o) {
        if (this == o) return true;                          // reflexive shortcut
        if (!(o instanceof CustomerId other)) return false;  // pattern matching (16+)
        return value.equals(other.value);
    }
    @Override public int hashCode() { return value.hashCode(); }  // MUST match equals
    @Override public String toString() { return "CustomerId(" + value + ")"; }
}

// a.equals(b) => a.hashCode() == b.hashCode().

// Hierarchy: Throwable -> Error (never catch) | Exception -> RuntimeException
public String readConfig(Path p) {
    try (BufferedReader r = Files.newBufferedReader(p)) {  // try-with-resources
        return r.readLine();                                // close() guaranteed
    } catch (NoSuchFileException e) {
        throw new ConfigMissingException(p, e);             // wrap + contextualize
    } catch (IOException e) {
        throw new UncheckedIOException(e);                  // suppressed attached
    } finally {
        // always runs; NEVER put business logic or returns here
    }
}
public class ConfigMissingException extends RuntimeException {
    public ConfigMissingException(Path p, Throwable cause) {
        super("config file not found: " + p, cause);
    }
}
// Checked: compiler forces handling (IOException). Unchecked: programming/business.
// Spring convention: unchecked + translation at boundaries (DataAccessException).

// Aspect (module) | Join point (method exec) | Pointcut (selector) | Advice (code)
@Aspect @Component
public class ServiceTimingAspect {
    @Pointcut("within(@org.springframework.stereotype.Service *)")
    void serviceLayer() {}

    @Before("serviceLayer()") public void enter(JoinPoint jp) { /* audit entry */ }
    @AfterReturning(pointcut = "serviceLayer()", returning = "r")
    public void ok(JoinPoint jp, Object r) { /* success hook */ }
    @AfterThrowing(pointcut = "serviceLayer()", throwing = "ex")
    public void fail(JoinPoint jp, Throwable ex) { log.error("failed {}", jp.getSignature()); }

    @Around("serviceLayer()")
    public Object time(ProceedingJoinPoint pjp) throws Throwable {
        long t = System.nanoTime();
        try { return pjp.proceed(); }              // you control execution
        finally {
            long ms = (System.nanoTime() - t) / 1_000_000;
            if (ms > 250) log.warn("slow {}", pjp.getSignature());
        }
    }
}
// Pointcuts: execution(...), within(...), @annotation(...), args(...), bean(...).
// Compose with && || !

// Spring AOP = PROXIES (JDK dynamic for interfaces, CGLIB subclass otherwise).
// The context injects the PROXY; your class is the target inside.
// @Transactional, @Async, @Cacheable, security all ride on proxies.

// SELF-INVOCATION TRAP (most common Spring bug):
@Service
public class OrderService {
    @Transactional
    public void outer() { this.inner(); }     // BYPASSES proxy: no transaction!
    @Transactional(propagation = Propagation.REQUIRES_NEW)
    public void inner() { }
}
// Fixes: extract inner() to another bean, or inject self via ObjectProvider.

// Transactions internally: TransactionInterceptor -> PlatformTransactionManager
// -> begin -> bind connection to THREAD (TransactionSynchronizationManager)
// -> DAOs reuse the SAME connection -> commit/rollback at method exit.
// That is why @Transactional + async/thread-hopping silently breaks.

<script type="text/plain" id="sn-s5_dispatch">
// DispatcherServlet flow:
// HTTP -> Tomcat -> FILTER CHAIN -> DispatcherServlet
//  -> HandlerMapping (URL+method -> controller method)
//  -> HandlerAdapter (invokes, resolves arguments)
//  -> Interceptors preHandle -> method -> postHandle
//  -> ExceptionResolvers / @RestControllerAdvice on failure
//  -> HttpMessageConverters serialize return (Jackson JSON)
//  -> afterCompletion -> response.

@Component @Order(Ordered.HIGHEST_PRECEDENCE)
public class RequestTimingFilter extends OncePerRequestFilter {
    protected void doFilterInternal(HttpServletRequest req, HttpServletResponse res, FilterChain chain)
            throws ServletException, IOException {
        long t = System.nanoTime();
        try { chain.doFilter(req, res); }
        finally { log.info("http path={} status={} took={}ms",
                req.getRequestURI(), res.getStatus(), (System.nanoTime()-t)/1_000_000); }
    }
}
@Component
public class AuthAuditInterceptor implements HandlerInterceptor {
    public boolean preHandle(HttpServletRequest req, HttpServletResponse res, Object handler) {
        audit.http(req); return true;   // false = short-circuit response
    }
}

<script type="text/plain" id="sn-s5_advice">
@RestControllerAdvice
public class GlobalExceptionHandler {
    private record ApiError(Instant ts, String code, String message,
                            String correlationId, Map<String, String> fieldErrors) {}

    @ExceptionHandler(MethodArgumentNotValidException.class)
    ResponseEntity<ApiError> validation(MethodArgumentNotValidException ex, HttpServletRequest req) {
        Map<String, String> fields = new LinkedHashMap<>();
        ex.getBindingResult().getFieldErrors()
          .forEach(fe -> fields.put(fe.getField(), fe.getDefaultMessage()));
        return ResponseEntity.badRequest().body(err("VALIDATION_FAILED", "Validation failed", fields, req));
    }
    @ExceptionHandler({AccountNotFoundException.class, CustomerNotFoundException.class})
    ResponseEntity<ApiError> notFound(RuntimeException ex, HttpServletRequest req) {
        return ResponseEntity.status(404).body(err("NOT_FOUND", ex.getMessage(), Map.of(), req));
    }
    @ExceptionHandler(InsufficientFundsException.class)
    ResponseEntity<ApiError> funds(InsufficientFundsException ex, HttpServletRequest req) {
        return ResponseEntity.status(422).body(err("INSUFFICIENT_FUNDS", ex.getMessage(), Map.of(), req));
    }
    @ExceptionHandler(Exception.class)
    ResponseEntity<ApiError> boom(Exception ex, HttpServletRequest req) {
        log.error("unhandled cid={}", req.getHeader("X-Correlation-Id"), ex);
        return ResponseEntity.status(500).body(err("INTERNAL_ERROR", "Unexpected error", Map.of(), req));
    }
}

<script type="text/plain" id="sn-s6_corr">
@Component @Order(Ordered.HIGHEST_PRECEDENCE)
public class CorrelationIdFilter extends OncePerRequestFilter {
    public static final String HEADER = "X-Correlation-Id";
    protected void doFilterInternal(HttpServletRequest req, HttpServletResponse res, FilterChain chain)
            throws ServletException, IOException {
        String cid = Optional.ofNullable(req.getHeader(HEADER))
                .filter(s -> !s.isBlank())
                .orElseGet(() -> UUID.randomUUID().toString());
        MDC.put("correlationId", cid);          // appears in every log line
        res.setHeader(HEADER, cid);
        try { chain.doFilter(req, res); }
        finally { MDC.clear(); }                // Tomcat REUSES threads - always clean
    }
}
// Kafka producers copy correlationId into event headers for cross-service tracing.

CREATE TABLE accounts (

    iban          VARCHAR(34) NOT NULL,
    currency      CHAR(3) NOT NULL,

-- Partial index: only rows the fraud queue scans:

<script type="text/plain" id="sn-s7_joins">
-- INNER: only matches; LEFT: all left + NULLs; RIGHT/FULL symmetric.
SELECT a.iban, t.amount_cents
FROM accounts a
LEFT JOIN transfers t ON t.source_account_id = a.id
WHERE a.status = 'ACTIVE';

-- CTE: readable multi-step queries
WITH daily AS (
    SELECT source_account_id, SUM(amount_cents) AS vol
    FROM transfers
    WHERE created_at >= now() - interval '1 day' AND status = 'COMPLETED'
    GROUP BY 1
)
SELECT a.iban, d.vol FROM daily d JOIN accounts a ON a.id = d.source_account_id
WHERE d.vol > 10000000;

-- WINDOW functions: per-row computation over a partition
SELECT iban, amount_cents,
       ROW_NUMBER() OVER (PARTITION BY source_account_id ORDER BY created_at DESC) AS rn,
       SUM(amount_cents) OVER (PARTITION BY source_account_id) AS account_total
FROM transfers JOIN accounts ON accounts.id = transfers.source_account_id;
-- Subqueries: prefer joins/CTEs; EXISTS beats IN on big sets.

<script type="text/plain" id="sn-s7_locks">
-- ACID: Atomicity, Consistency, Isolation, Durability (WAL flushed on commit).
-- Isolation: READ COMMITTED (default) | REPEATABLE READ | SERIALIZABLE.
-- READ COMMITTED: each STATEMENT sees a fresh snapshot. The sane default.

-- Who blocks whom RIGHT NOW:
SELECT blocked.pid AS blocked_pid, blocked.query AS blocked_query,
       blocking.pid AS blocking_pid, blocking.query AS blocking_query
FROM pg_stat_activity blocked
JOIN pg_locks bl ON bl.pid = blocked.pid AND NOT bl.granted
JOIN pg_locks gl ON gl.relation = bl.relation AND gl.pid <> bl.pid AND gl.granted
JOIN pg_stat_activity blocking ON blocking.pid = gl.pid;
-- Deadlock: PostgreSQL detects, aborts one side: 'ERROR: deadlock detected'.
-- App must retry; prevent via consistent lock order.
-- Row locks: SELECT ... FOR UPDATE inside a tx.
</script>
<script type="text/plain" id="sn-s7_norm">
-- Normalization: 1NF atomic cells; 2NF no partial deps; 3NF no transitive deps.
CREATE TABLE customers (id UUID PRIMARY KEY, name TEXT);
CREATE TABLE addresses (id UUID PRIMARY KEY, customer_id UUID REFERENCES customers, city TEXT);
CREATE TABLE orders    (id UUID PRIMARY KEY, customer_id UUID REFERENCES customers,
                        address_id UUID REFERENCES addresses, total_cents BIGINT);
-- Denormalize only with a reason (read-heavy reporting; immutable snapshots,
-- e.g. iban_snapshot on transfers for audit).
-- Stored functions: sparingly, for data hygiene:
CREATE OR REPLACE FUNCTION expire_stale_transfers(stale_after interval) RETURNS int
LANGUAGE plpgsql AS $$
DECLARE n int;
BEGIN
  UPDATE transfers SET status='EXPIRED'
   WHERE status='INITIATED' AND created_at < now() - stale_after;
  GET DIAGNOSTICS n = ROW_COUNT; RETURN n;
END $$;
-- Business logic mostly lives in Java (testable).

repo.save(a);                     // persist() -> managed (INSERT at flush)
// ... tx ends -> detached
a.setIban("NEW"); repo.save(a);   // merge() -> SELECT + UPDATE (reattach)
repo.delete(a);                   // removed -> DELETE at flush

em.flush();     // push pending SQL now
em.clear();     // evict ALL (batch jobs: flush+clear every N)
em.detach(a);   // evict one
// Spring save(): persist if new (no id), else merge.
// Batch inserts: hibernate.jdbc.batch_size=50 + ordered ids.

@Configuration @EnableWebSecurity @EnableMethodSecurity
public class SecurityConfig {
    @Bean
    SecurityFilterChain apiChain(HttpSecurity http, JwtAuthenticationConverter conv) throws Exception {
        return http
            .csrf(csrf -> csrf.disable())                 // stateless Bearer API
            .sessionManagement(sm -> sm.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
            .authorizeHttpRequests(auth -> auth
                .requestMatchers("/api/v1/auth/**", "/actuator/health/**", "/v3/api-docs/**").permitAll()
                .requestMatchers("/api/v1/admin/**").hasRole("ADMIN")      // AUTHORIZATION
                .requestMatchers(HttpMethod.DELETE, "/api/v1/accounts/**").hasRole("ADMIN")
                .anyRequest().authenticated())                              // AUTHENTICATION
            .oauth2ResourceServer(o -> o.jwt(j -> j.jwtAuthenticationConverter(conv)))
            .exceptionHandling(ex -> ex
                .authenticationEntryPoint((req, res, e) -> res.sendError(401))   // 401
                .accessDeniedHandler((req, res, e) -> res.sendError(403)))       // 403
            .build();
    }
    @Bean PasswordEncoder passwordEncoder() { return new BCryptPasswordEncoder(12); }
    @Bean AuthenticationManager authManager(AuthenticationConfiguration cfg) throws Exception {
        return cfg.getAuthenticationManager();
    }
}

// -> BearerTokenAuthenticationFilter -> ExceptionTranslationFilter -> AuthorizationFilter.

<script type="text/plain" id="sn-s9_jwt">
@Component
public class TokenService {
    private final KeyPair keys;     // RSA 2048+ or ECDSA P-256; public key via JWKS

    public TokenPair issue(Customer c) {
        Instant now = Instant.now();
        String access = Jwts.builder()
            .subject(c.getId().toString())                       // sub: who
            .issuer("https://auth.bank.internal")                // iss: signer
            .audience().add("banking-api").and()                 // aud: for whom
            .claim("roles", c.getRoles())                        // authorization data
            .issuedAt(Date.from(now))
            .expiration(Date.from(now.plus(15, ChronoUnit.MINUTES))) // SHORT-lived
            .id(UUID.randomUUID().toString())                    // jti: revocation
            .signWith(keys.getPrivate(), Jwts.SIG.RS256)         // asymmetric
            .compact();
        return new TokenPair(access, refreshService.issue(c.getId()));
    }
    public Claims verify(String token) {
        return Jwts.parser()
            .verifyWith(keys.getPublic())                        // signature
            .requireIssuer("https://auth.bank.internal")
            .requireAudience("banking-api")                      // iss+aud+exp enforced
            .build().parseSignedClaims(token).getPayload();
    }
}
// JWT anatomy: header{alg,typ} . payload{sub,iss,aud,exp,jti,claims} . signature
// Base64Url, NOT encrypted - no secrets/PII in payloads.
</script>
<script type="text/plain" id="sn-s9_refresh">
@Service
public class RefreshTokenService {
    private final RefreshTokenRepository repo;
    private final SecureRandom random = new SecureRandom();

    public String issue(UUID customerId) {
        byte[] raw = new byte[32]; random.nextBytes(raw);
        String token = Base64.getUrlEncoder().withoutPadding().encodeToString(raw);
        repo.save(new RefreshTokenEntity(customerId, sha256(token),   // HASH only!
                Instant.now().plus(30, ChronoUnit.DAYS)));
        return token;                                                 // sent once
    }
    // ROTATION: each use invalidates old token and issues a new pair.
    // Reuse of a rotated token = stolen credential -> revoke WHOLE family.
    public TokenPair rotate(String presented) {
        RefreshTokenEntity stored = repo.findByHash(sha256(presented))
            .orElseThrow(() -> new InvalidTokenException("unknown refresh"));
        if (stored.isRevoked()) { repo.revokeFamily(stored.familyId()); throw new TokenReuseDetected(); }
        if (stored.isExpired()) throw new InvalidTokenException("expired");
        stored.revoke(); repo.save(stored);
        return new TokenPair(accessFor(stored.customerId()), issue(stored.customerId()));
    }
}
// Stateless access tokens (15 min) + rotating refresh (30 d) = standard.
</script>

@Service
public class PaymentEventPublisher {
    private final KafkaTemplate<String, String> kafka;
    private final ObjectMapper mapper;

    public CompletableFuture<Void> publishPaymentInitiated(PaymentInitiated event) {
        try {
            String payload = mapper.writeValueAsString(event);
            // KEY = accountId => all events of one account -> ONE partition => order
            return kafka.send(Topics.PAYMENT_INITIATED, event.accountId(), payload)
                .completable()
                .thenApply(r -> {
                    var md = r.getRecordMetadata();
                    log.info("published topic={} partition={} offset={}", md.topic(), md.partition(), md.offset());
                    return null;
                });
        } catch (JsonProcessingException e) {
            throw new IllegalStateException("cannot serialize event", e);
        }
    }
}
// acks=all: broker acks after ISR wrote it. enable-idempotence=true: PID +
// sequence numbers => retries never duplicate/reorder within a partition.
// retries=Integer.MAX_VALUE, linger.ms=5, compression.type=lz4.

<script type="text/plain" id="sn-s10_listener">
@Configuration
public class KafkaConsumerConfig {
    @Bean
    ConcurrentKafkaListenerContainerFactory<String, String> factory(
            ConsumerFactory<String, String> cf, KafkaTemplate<String, String> kt) {
        // 3 retries, 1s backoff, then dead-letter topic <topic>.DLT
        DeadLetterPublishingRecoverer dlt = new DeadLetterPublishingRecoverer(kt,
            (rec, ex) -> new TopicPartition(rec.topic() + ".DLT", rec.partition()));
        DefaultErrorHandler errors = new DefaultErrorHandler(dlt, new FixedBackOff(1_000L, 3));
        errors.addNotRetryableExceptions(DeserializationException.class); // poison -> DLT now
        var f = new ConcurrentKafkaListenerContainerFactory<String, String>();
        f.setConsumerFactory(cf);
        f.setConcurrency(3);
        f.setCommonErrorHandler(errors);
        f.getContainerProperties().setAckMode(ContainerProperties.AckMode.RECORD);
        return f;
    }
}

<script type="text/plain" id="sn-s10_outbox">
// OUTBOX PATTERN: the event write JOINS the business transaction.
@Service
public class TransferService {
    @Transactional
    public TransferView execute(TransferRequest req) {
        Transfer transfer = Transfer.create(req);
        accounts.lockForUpdate(req.sourceId()).debit(req.amountCents());
        accounts.lockForUpdate(req.targetId()).credit(req.amountCents());
        transfers.save(transfer);
        outbox.save(new OutboxMessage(Topics.PAYMENT_INITIATED,
                    req.sourceId(), json(new PaymentInitiated(transfer))));
        return TransferView.from(transfer);   // ONE commit: state + event, atomic
    }
}
@Scheduled(fixedDelay = 250)
@Transactional
public void relay() {                          // CDC (Debezium) = zero-poll variant
    for (OutboxMessage m : outboxRepo.findUnpublished(500)) {
        kafka.send(m.topic(), m.key(), m.payload());
        m.markPublished();
    }
}
// Dual-write solved. Consumers still at-least-once -> eventId dedup table.
</script>
<script type="text/plain" id="sn-s11_cacheaside">
@Service
public class AccountCache {
    private final AccountRepository repo;
    private final StringRedisTemplate redis;

    public AccountView get(UUID id) {
        String key = "account:%s".formatted(id);
        String cached = redis.opsForValue().get(key);
        if (cached != null) return read(cached);                     // HIT
        AccountView fresh = AccountView.from(repo.findById(id)
            .orElseThrow(() -> new AccountNotFoundException(id)));
        redis.opsForValue().set(key, write(fresh),
            Duration.ofMinutes(5).plusMillis(ThreadLocalRandom.current().nextLong(30_000))); // jitter
        return fresh;                                                // MISS: load+fill
    }
    @TransactionalEventListener  // AFTER commit: never cache uncommitted state
    public void on(AccountChanged e) {
        redis.delete("account:%s".formatted(e.accountId()));         // DELETE > update
    }
}
// PATTERNS: cache-aside | read-through | write-through | write-behind.
// Failures: stampede (locks/singleflight), penetration (cache negatives),
// avalanche (TTL jitter). Cache-down must not block requests.
</script>
<script type="text/plain" id="sn-s11_lock">
// DISTRIBUTED LOCK: SET key token NX PX ttl; release only if still yours (Lua).
public boolean tryLock(String resource, Duration ttl) {
    String token = UUID.randomUUID().toString();
    Boolean ok = redis.opsForValue().setIfAbsent("lock:" + resource, token, ttl);
    if (Boolean.TRUE.equals(ok)) TOKEN.set(token);
    return Boolean.TRUE.equals(ok);
}
private static final String RELEASE =
  "if redis.call('get',KEYS[1])==ARGV[1] then return redis.call('del',KEYS[1]) end return 0";
public void unlock(String resource) {
    redis.execute(new DefaultRedisScript<>(RELEASE, Long.class),
        List.of("lock:" + resource), TOKEN.get());
}
// Uses: single-flight importers, leader jobs. Money movement = DB ROW LOCKS.
// Also: INCR counters, session/refresh hashes, sorted-set delayed queues.
</script>

<script type="text/plain" id="sn-s12_idempotency">
@Service
public class IdempotencyService {
    // table: idempotency_keys(key PK, response JSONB, status, created_at)
    @Transactional
    public TransferView executeOnce(String key, Supplier<TransferView> work) {
        return idemRepo.findById(key).map(rec -> {
            if (rec.isProcessing()) throw new ConflictException("same key in flight");
            return rec.responseAs(TransferView.class);     // REPLAY stored result
        }).orElseGet(() -> {
            idemRepo.save(IdempotencyRecord.processing(key));
            TransferView r = work.get();                   // same tx as business write
            idemRepo.complete(key, r);
            return r;
        });
    }
}
// Contract: POST /transfers REQUIRES Idempotency-Key (client UUID).
// Same key again => byte-identical response; money moves once.
// TTL keys after 24-72h; scope per customer.
</script>

// Synchronous inter-service calls: RestClient (Spring 6.1, blocking, simple)

@Configuration
public class HttpClientConfig {
    @Bean
    RestClient riskClient(RestClient.Builder b) {
        return b.baseUrl("http://risk-service.internal")
                .requestFactory(new JdkClientHttpRequestFactory(
                    HttpClient.newBuilder().connectTimeout(Duration.ofSeconds(2)).build()))
                .defaultHeader(HttpHeaders.ACCEPT, MediaType.APPLICATION_JSON_VALUE)
                .build();
    }
}
@Service
public class RiskGateway {
    private final RestClient client;
    public RiskRating rate(UUID accountId) {
        return client.get().uri("/api/v1/risk/{id}", accountId)
            .retrieve()
            .onStatus(HttpStatusCode::isError, (req, res) -> { throw new RiskUnavailable(); })
            .body(RiskRating.class);
    }
}
// Always: connect+read timeouts shorter than YOUR caller's timeout;
// propagate X-Correlation-Id; wrap with Resilience4j (below).
// Service discovery on ECS: Cloud Map / internal ALB + DNS; config via
// Parameter Store, not hardcoded URLs.
</script>
<script type="text/plain" id="sn-s15_resilience">
resilience4j:
  circuitbreaker:
    instances:
      riskService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50        # OPEN at 50% failures over 20 calls
        waitDurationInOpenState: 30s    # then HALF-OPEN: probe calls
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 800ms
        slowCallRateThreshold: 80
  retry:
    instances:
      riskService:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        retryExceptions: [java.io.IOException, java.util.concurrent.TimeoutException]
  timelimiter:
    instances: { riskService: { timeoutDuration: 2s } }
  bulkhead:
    instances: { riskService: { maxConcurrentCalls: 20 } }   # isolate the pool
</script>
<script type="text/plain" id="sn-s15_fallback">
@Service
public class EnrichmentService {
    private final RiskGateway risk;

    // Order: TimeLimiter -> CircuitBreaker -> Retry -> Bulkhead -> call.
    @CircuitBreaker(name = "riskService", fallbackMethod = "riskFallback")
    @Retry(name = "riskService")
    @TimeLimiter(name = "riskService")
    public CompletableFuture<RiskRating> rate(UUID accountId) {
        return CompletableFuture.supplyAsync(() -> risk.rate(accountId));
    }
    // FALLBACK: same signature + Throwable. Degrade, don't fail the user.
    CompletableFuture<RiskRating> riskFallback(UUID accountId, Throwable t) {
        log.warn("risk_unavailable accountId={} cause={}", accountId, t.toString());
        return CompletableFuture.completedFuture(RiskRating.UNKNOWN);
    }
}
// CLOSED -> OPEN (fast-fail, shed load) -> HALF-OPEN (probe) -> CLOSED.
// Retry: jittered exponential, idempotent ops only, capped.
// Bulkhead: bounded pool so one slow peer can't drown the JVM.
</script>
<script type="text/plain" id="sn-s15_saga">
// SAGA = sequence of local transactions + compensations, coordinated by events.
// Choreography (services react) vs Orchestration (coordinator commands).
@Service
public class OrderSagaOrchestrator {

    @KafkaListener(topics = "order-created", groupId = "order-saga")
    public void start(String payload) {
        OrderCreated e = parse(payload);
        saga.save(e.orderId(), "RESERVING");
        kafka.send("inventory-reserve-request", e.orderId(), reserveCommand(e)); // step 1
    }
    @KafkaListener(topics = {"inventory-reserved","inventory-rejected"}, groupId = "order-saga")
    public void afterInventory(String payload) {
        SagaEvent e = parse(payload);
        if (e.type().equals("inventory-reserved")) {
            saga.advance(e.orderId(), "PAYING");
            kafka.send("payment-initiate-request", e.orderId(), payCommand(e));  // step 2
        } else {
            saga.fail(e.orderId(), "NO_STOCK");
            kafka.send("order-cancelled", e.orderId(), cancelEvent(e));
        }
    }
    @KafkaListener(topics = {"payment-success","payment-failed"}, groupId = "order-saga")
    public void afterPayment(String payload) {
        SagaEvent e = parse(payload);
        if (e.type().equals("payment-success")) {
            saga.complete(e.orderId()); kafka.send("order-confirmed", e.orderId(), confirm(e));
        } else {
            kafka.send("inventory-release-request", e.orderId(), release(e));    // COMPENSATION
            saga.fail(e.orderId(), "PAYMENT_FAILED");
            kafka.send("order-cancelled", e.orderId(), cancelEvent(e));
        }
    }
}
// Every step idempotent (eventId dedup), state durable, timeouts sweep stuck
// sagas to compensation. Eventual consistency is the deal.
</script>

@Component
public class TransferMetrics {
    private final Counter ok, failed; private final Timer latency;
    public TransferMetrics(MeterRegistry r) {
        ok     = Counter.builder("banking.transfers.total").tag("result","success").register(r);
        failed = Counter.builder("banking.transfers.total").tag("result","failure").register(r);
        latency = Timer.builder("banking.transfers.duration")
                       .publishPercentiles(0.5, 0.95, 0.99).register(r);
    }
    public void success(long ms) { ok.increment(); latency.record(Duration.ofMillis(ms)); }
    public void failure() { failed.increment(); }
}

name: deploy
on: { push: { branches: [main] } }
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: temurin, cache: maven }
      - run: mvn -B verify                 # unit + integration + coverage gate
      - uses: sonarsource/sonarqube-scan-action@v3    # static analysis gate
  publish:
    needs: build-test
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }   # OIDC: no long-lived keys
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: arn:aws:iam::123456789012:role/github-deploy, aws-region: eu-west-1 }
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - run: |
          TAG=$(git rev-parse --short HEAD)
          IMG=${{ steps.ecr.outputs.registry }}/banking-api:$TAG
          docker build --platform linux/amd64 -t $IMG .
          trivy image --severity HIGH,CRITICAL --exit-code 1 $IMG   # scan gate
          docker push $IMG

public class FraudAssistantController {

    public FraudAssessment review(@Valid @RequestBody FraudReviewRequest req) {

                .param("amount", req.amountCents())
                .param("currency", req.currency())
                .param("history", req.recentHistory()))
            .call()

@Service
public class SupportChatService {
    private final ChatClient chat;
    private final ChatMemory memory;   // MessageWindowChatMemory in Redis/DB

    public SupportChatService(ChatClient.Builder b, ChatMemoryRepository repo) {
        this.memory = MessageWindowChatMemory.builder()
                .chatMemoryRepository(repo)
                .maxMessages(20)                 // bounded window = bounded tokens
                .build();
        this.chat = b.defaultAdvisors(
                MessageChatMemoryAdvisor.builder(memory).build()).build();
    }
    public String chat(String conversationId, String userMessage) {
        return chat.prompt()
            .user(userMessage)
            .advisors(a -> a.param(ChatMemory.CONVERSATION_ID, conversationId))
            .call().content();
    }
}
// Advisors = interceptors of the prompt pipeline: memory, RAG, logging, safety.
// Order matters: memory BEFORE retrieval BEFORE send.
// Persist ChatMemoryRepository in Postgres/Redis; expire conversations; redact PII.

<script type="text/plain" id="sn-ai_rag">
// RAG: ground answers in YOUR documents: ingest -> split -> embed -> store;
// at query time retrieve top-k similar chunks and inject as trusted context.

// 1) INGESTION (ETL), run as a batch job:
@Service
public class PolicyKnowledgeLoader {
    private final VectorStore store;
    public void load(Resource feePolicyPdf) {
        var reader = new TikaDocumentReader(feePolicyPdf);
        List<Document> docs = new TokenTextSplitter().apply(reader.get());
        docs.forEach(d -> d.getMetadata().put("source", "fee-policy-2026"));
        store.add(docs);                     // embedding + pgvector insert
    }
}
// 2) QUERY with QuestionAnswerAdvisor (retrieve + augment in one line):
@Service
public class PolicyAssistant {
    private final ChatClient chat;
    public PolicyAssistant(ChatClient.Builder b, VectorStore store) {
        this.chat = b.defaultAdvisors(
            QuestionAnswerAdvisor.builder(store)
                .searchRequest(SearchRequest.builder().topK(6).similarityThreshold(0.75).build())
                .build()).build();
    }
    public Answer answer(String question) {
        return chat.prompt().user(question).call().entity(Answer.class);
    }
}
record Answer(String answer, List<String> sources) {}
// pgvector on your existing RDS: similarity search in SQL, HNSW index,
// metadata filters (tenant, product). No new infrastructure.

<script type="text/plain" id="sn-p1_schema">
-- V1__banking_core.sql
CREATE EXTENSION IF NOT EXISTS "pgcrypto";

-- PROFILE: business identity
CREATE TABLE customers (
    id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    full_name     VARCHAR(120) NOT NULL,
    date_of_birth DATE,
    status        VARCHAR(16) NOT NULL DEFAULT 'ACTIVE',
    created_at    TIMESTAMPTZ NOT NULL DEFAULT now()
);
-- USERS: authentication identity (login, roles) - 1:1 with customer
CREATE TABLE users (
    id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    customer_id   UUID NOT NULL UNIQUE REFERENCES customers(id),
    email         VARCHAR(255) NOT NULL,
    password_hash VARCHAR(100) NOT NULL,
    roles         VARCHAR(64) NOT NULL DEFAULT 'USER',
    failed_attempts INT NOT NULL DEFAULT 0,
    locked_until  TIMESTAMPTZ,
    status        VARCHAR(16) NOT NULL DEFAULT 'ACTIVE',
    created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
    CONSTRAINT uq_users_email UNIQUE (email)
);
CREATE TABLE accounts (
    id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    customer_id   UUID NOT NULL REFERENCES customers(id),
    iban          VARCHAR(34) NOT NULL,
    currency      CHAR(3) NOT NULL,
    balance_cents BIGINT NOT NULL DEFAULT 0 CHECK (balance_cents >= 0),
    status        VARCHAR(16) NOT NULL DEFAULT 'ACTIVE',
    version       BIGINT NOT NULL DEFAULT 0,
    created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
    CONSTRAINT uq_accounts_iban UNIQUE (iban)
);
CREATE INDEX idx_accounts_customer ON accounts (customer_id);

-- TRANSFERS: money movement ORDERS (with idempotency key)
CREATE TABLE transfers (
    id                UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    idempotency_key   VARCHAR(64) NOT NULL,
    source_account_id UUID NOT NULL REFERENCES accounts(id),
    target_account_id UUID NOT NULL REFERENCES accounts(id),
    amount_cents      BIGINT NOT NULL CHECK (amount_cents > 0),
    currency          CHAR(3) NOT NULL,
    status            VARCHAR(20) NOT NULL,   -- INITIATED|COMPLETED|FAILED
    failure_reason    VARCHAR(255),
    created_at        TIMESTAMPTZ NOT NULL DEFAULT now(),
    completed_at      TIMESTAMPTZ,
    CONSTRAINT uq_transfers_idem UNIQUE (idempotency_key),
    CONSTRAINT ck_different CHECK (source_account_id <> target_account_id)
);
CREATE INDEX idx_transfers_source ON transfers (source_account_id, created_at DESC);

-- TRANSACTIONS: immutable LEDGER entries (DEBIT/CREDIT per account)
CREATE TABLE transactions (
    id                  BIGSERIAL PRIMARY KEY,
    transfer_id         UUID NOT NULL REFERENCES transfers(id),
    account_id          UUID NOT NULL REFERENCES accounts(id),
    entry_type          VARCHAR(6) NOT NULL CHECK (entry_type IN ('DEBIT','CREDIT')),
    amount_cents        BIGINT NOT NULL CHECK (amount_cents > 0),
    balance_after_cents BIGINT NOT NULL,
    created_at          TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE INDEX idx_transactions_account ON transactions (account_id, created_at DESC);

-- TRANSACTION_EVENTS: per-transfer state history (for audit + replay)
CREATE TABLE transaction_events (
    id          BIGSERIAL PRIMARY KEY,
    transfer_id UUID NOT NULL REFERENCES transfers(id),
    event_type  VARCHAR(32) NOT NULL,     -- INITIATED|COMPLETED|FAILED|REVERSED
    payload     JSONB,
    created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE INDEX idx_txn_events_transfer ON transaction_events (transfer_id, created_at);

-- IDEMPOTENCY_KEYS: replay store for POST /transfers
CREATE TABLE idempotency_keys (
    key         VARCHAR(64) PRIMARY KEY,
    customer_id UUID NOT NULL REFERENCES customers(id),
    status      VARCHAR(16) NOT NULL,      -- PROCESSING|COMPLETE
    response    JSONB,
    created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
    expires_at  TIMESTAMPTZ NOT NULL
);

-- OUTBOX: events join the business transaction (Module 10)
CREATE TABLE outbox_messages (
    id BIGSERIAL PRIMARY KEY, topic VARCHAR(120) NOT NULL, key VARCHAR(120),
    payload JSONB NOT NULL, published_at TIMESTAMPTZ, created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE INDEX idx_outbox_unpublished ON outbox_messages (created_at) WHERE published_at IS NULL;

-- AUDIT_LOGS: append-only trail
CREATE TABLE audit_logs (
    id BIGSERIAL PRIMARY KEY, actor_id UUID, action VARCHAR(64) NOT NULL,
    entity_type VARCHAR(32) NOT NULL, entity_id VARCHAR(64), detail JSONB,
    correlation_id VARCHAR(64), created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE INDEX idx_audit_entity ON audit_logs (entity_type, entity_id, created_at DESC);

--   metadata JSONB, embedding vector(1536));

<script type="text/plain" id="sn-p1_transfer">
@Service
public class TransferService {
    private final AccountRepository accounts;
    private final TransferRepository transfers;
    private final OutboxRepository outbox;

    @Transactional(timeout = 5, rollbackFor = Exception.class)
    public TransferView execute(TransferCommand cmd) {
        // 1. Idempotency: replay instead of double-spend (idempotency_keys table)
        Optional<Transfer> replay = transfers.findByIdempotencyKey(cmd.idempotencyKey());
        if (replay.isPresent()) {
            log.info("duplicate_transfer key={} replaying", cmd.idempotencyKey());
            return TransferView.from(replay.get());
        }
        // 2. Deterministic lock order => deadlock-free
        UUID lo = min(cmd.sourceAccountId(), cmd.targetAccountId());
        UUID hi = max(cmd.sourceAccountId(), cmd.targetAccountId());
        Account a = accounts.findByIdForUpdate(lo);      // SELECT ... FOR UPDATE
        Account b = accounts.findByIdForUpdate(hi);
        Account source = lo.equals(cmd.sourceAccountId()) ? a : b;
        Account target = lo.equals(cmd.sourceAccountId()) ? b : a;
        // 3. Business rules
        if (!source.isActive() || !target.isActive()) throw new AccountNotActiveException();
        if (source.balanceCents() < cmd.amountCents()) {
            Transfer failed = Transfer.failed(cmd, "INSUFFICIENT_FUNDS");
            transfers.save(failed);
            outbox.save(OutboxMessage.of(Topics.PAYMENT_FAILED, failed));
            return TransferView.from(failed);
        }
        // 4. Money + ledger (transactions) + transfer_events + outbox in ONE commit
        source.debit(cmd.amountCents()); target.credit(cmd.amountCents());
        Transfer done = Transfer.completed(cmd);
        transfers.save(done);
        ledger.writeDebitCredit(done, source, target);
        outbox.save(OutboxMessage.of(Topics.PAYMENT_COMPLETED, done));
        log.info("transfer_ok id={} amount={}c", done.getId(), cmd.amountCents());
        return TransferView.from(done);
    }
}
</script>

// FRAUD INSIGHTS SERVICE (Spring AI feature of Project 1):
// payment-initiated -> fraud-sim consumer -> for HIGH risk ask the assistant
// for human-readable reasoning -> audit + notification.
@Component
public class FraudInsightConsumer {
    private final ChatClient chat;
    private final AuditService audit;

    @KafkaListener(topics = Topics.PAYMENT_INITIATED, groupId = "fraud-insights")
    public void on(String payload) throws JsonProcessingException {
        PaymentInitiated e = mapper.readValue(payload, PaymentInitiated.class);
        if (!processed.tryMark(e.eventId())) return;             // idempotent
        RiskScore score = rules.score(e);                        // deterministic first
        if (score.level() == HIGH) {
            FraudAssessment ai = chat.prompt()
                .user(u -> u.text(FRAUD_PROMPT)
                    .param("amount", e.amountCents())
                    .param("history", history(e.sourceAccountId())))
                .call().entity(FraudAssessment.class);           // structured output
            audit.record("AI_FRAUD_REVIEW", e.transferId(), ai); // explainability
            if (ai.riskLevel() == BLOCK) holds.hold(e.transferId(), ai.reasoning());
        }
    }
}
// Design rules: deterministic rules FIRST, LLM advisory second; every AI
// decision audited; money path never blocks on model latency.

// Cart lives in REDIS (fast, ephemeral); persisted to Postgres at checkout.
@Service
public class CartService {
    private final StringRedisTemplate redis;

    public CartView get(UUID userId) {
        return read(redis.opsForHash().entries("cart:" + userId));
    }
    public CartView add(UUID userId, UUID productId, int qty) {
        redis.opsForHash().increment("cart:" + userId, productId.toString(), qty);
        redis.expire("cart:" + userId, Duration.ofDays(7));
        return get(userId);
    }
    public void clear(UUID userId) { redis.delete("cart:" + userId); } // after order-created
}
// Rules: cart is NOT inventory. Reservation happens ONLY at order placement
// (atomic conditional UPDATE). Guest carts keyed by session id; merge on login.

@Modifying
@Query("""
    UPDATE Product p
       SET p.availableStock = p.availableStock - :qty
     WHERE p.id = :productId
       AND p.availableStock >= :qty
    """)
int reserve(@Param("productId") UUID productId, @Param("qty") int qty);

m10:{num:"10",title:"Kafka — Streaming Backbone",group:"Messaging",mins:300,
topics:["Architecture (broker/cluster/topic/partition)","Producer/Consumer","Consumer groups","Offsets","Leader/Follower/ISR","Rebalancing","Ordering & keys","Partitioning","Retention/Compaction","acks 0/1/all","Retries","Idempotent producer","Delivery semantics","JSON/Avro/Protobuf","Schema Registry","Spring Kafka","KafkaTemplate","@KafkaListener","Error handling/retry/DLT/backoff","Poison messages","Idempotent consumers","Transactions","Outbox","CDC","Monitoring","Security SASL/SSL","MSK"],
addons:["a4"],
blocks:[
H("The mental model"),
P("Kafka = **distributed, partitioned, replicated commit log**. Topics split into partitions (ordering + parallelism unit); replicas form the **ISR**; the leader serves I/O. Consumer groups divide partitions; offsets mark progress. Retention deletes by time/size; compaction keeps latest per key."),

["Broker / Cluster","server / set of brokers with controller"],
["Topic / Partition","named log / ordered shard of it"],
["Offset","per-partition read position"],
["Leader / Follower","serves r/w / copies leader"],
["ISR","replicas caught up; acks=all waits for them"],
["Consumer group","subscribers sharing partitions"],
["Rebalance","partition reassignment on membership change (cooperative)"],
["Key","determines partition → ordering boundary"]]),
CODE("s10_topics","bash","production topic creation with RF/min-ISR/retention"),
H("Producers"),
CODE("s10_producer","java","keyed sends + metadata logging"),
TBL("acks","Value","Guarantee","Use",[
["0","fire & forget","metrics sampling"],
["1","leader wrote","low-value events"],
["all","ISR wrote","money events + idempotence"]]),
P("**Idempotent producer** (`enable.idempotence=true`): PID + sequence numbers make retries duplicate-free and order-preserving per partition. Retries effectively infinite; batching via `linger.ms`; lz4 compression."),
H("Consumers, retries, poison, DLT"),
CODE("s10_config","yaml","producer/consumer/listener production config"),
CODE("s10_listener","java","listener factory: backoff, DLT, non-retryable deserialization"),
TBL("Delivery semantics","Semantic","Reality","How",[
["At-most-once","may lose","commit before processing"],
["At-least-once (default)","may duplicate","process → commit; idempotent consumers"],
["Exactly-once (Kafka-internal)","no dup in Kafka","transactions + read_committed; end-to-end still needs idempotency"]]),
H("Schemas & serialization"),
CODE("s10_schema","java","JSON event record + evolution rules + typed factory + transactions"),
P("Avro/Protobuf + **Schema Registry** enforce compatibility; JSON needs discipline (add-only fields, ignore unknown). Every event: eventId, eventType, occurredAt, correlationId + payload."),
H("Patterns: outbox, CDC, monitoring, security"),
CODE("s10_outbox","java","outbox publisher + relay; dual-write solved"),
UL(["**CDC**: Debezium on the outbox (or business tables) streams changes to Kafka with zero polling.","**Monitoring**: consumer lag per group, produce rate, ISR shrinks, under-replicated partitions, DLT depth (alert!).","**Security**: SASL (IAM on MSK, SCRAM self-hosted) + TLS in transit; ACLs per principal per topic.","**AWS MSK**: managed brokers in your VPC; you keep topic config, client IAM roles, scaling."]),
CALL("dbg","Debugging Kafka","Lag growing → describe consumer group; slow handler or rebalance storm. Rebalance loops → max.poll.interval exceeded. Deserialization errors → DLT + fix schema. Duplicates → missing eventId guard. Producer timeouts → acks=all + min-ISR misconfig."),
QA([
{q:"Partition vs consumer group?",a:"Partition = storage/ordering/parallelism unit. Group = subscription unit: members divide partitions. 6 partitions, 3 consumers = 2 each; 9 consumers = 3 idle."},
{q:"Why outbox instead of sending in @Transactional?",a:"Dual-write: DB commit + Kafka send are two failure domains. Outbox stores the event in the same transaction; relay publishes. State and event never diverge."},
{q:"SQS vs Kafka?",a:"SQS: queue, no replay, limited ordering, serverless-simple. Kafka: replayable log, ordering per key, fan-out via groups, stream processing. Event history ⇒ Kafka; job queue ⇒ SQS."},
{q:"How is ordering guaranteed?",a:"Only within a partition. Key = ordering boundary (accountId). No key ⇒ round-robin ⇒ no order. Single-partition topics serialize everything — throughput cliff."}])
]},

m22:{num:"22",title:"Spring AI — LLMs in Production Spring Apps",group:"Spring AI",mins:240,
topics:["Spring AI architecture","ChatModel/ChatClient","Prompts & messages","Structured output","Advisors","Chat memory","RAG + VectorStore + pgvector","Embeddings","Function/tool calling","Streaming","Providers (OpenAI/Ollama)","Config & retries","Security: prompt injection","Cost/timeouts","Evals & testing"],
addons:["a5"],
blocks:[
H("What Spring AI is (and is not)"),
P("Spring AI gives Spring-native abstractions over AI providers: `ChatModel` (the driver), `ChatClient` (fluent API like WebClient), `Prompt`/`Message` (system/user/assistant roles), `Advisors` (pipeline interceptors — memory, RAG, safety), `VectorStore` + `EmbeddingModel` (semantic search), and tool calling (the model invokes your Java methods). It is **not** magic: treat the model as an unreliable, non-deterministic dependency — timeout it, budget it, validate it, audit it."),
TBL("Coverage map","Concept","What you must know",[
["ChatModel","provider driver","OpenAI/Ollama/Anthropic/Bedrock starters"],
["ChatClient","fluent builder","defaultSystem/advisors/tools"],
["Messages","system/user/assistant","persona/rules vs input vs output"],
["Structured output","entity(Class)","JSON→records with validation/retry"],
["Advisors","interceptors","memory, RAG, logging; order matters"],
["ChatMemory","bounded window","per conversation id"],
["RAG","retrieve→augment→ground","top-k chunks + threshold"],
["VectorStore","pgvector/Redis","similarity search + metadata filters"],
["EmbeddingModel","text → vector","same model ingest + query"],
["Tool calling","@Tool methods","args marshalled; authz stays yours"],
["Streaming","Flux<String>","SSE tokens"],
["Providers","starter per vendor","swap via config"],
["Retries/cost","spring.ai.retry","token budgets; per-user quotas"],
["Security","prompt injection","PII masking, output validation, audit"]]),
H("Setup"),
CODE("ai_deps","xml","Spring AI BOM + OpenAI/pgvector starters"),
CODE("ai_config","yaml","provider config, temperature, retries, pgvector"),
H("Chat + structured output"),
CODE("ai_chat","java","ChatClient with system guardrails + entity() mapping"),
P("`.entity(FraudAssessment.class)` asks for JSON matching your record and converts it — with automatic retry on schema violations. Temperature low (0–0.3) for banking answers; the **system prompt** is your first guardrail: answer only from context, refuse out-of-scope."),
H("Memory (conversations)"),
CODE("ai_memory","java","MessageWindowChatMemory + MessageChatMemoryAdvisor"),
H("RAG: ground answers in your documents"),
CODE("ai_rag","java","ETL ingestion into pgvector + QuestionAnswerAdvisor retrieval"),
P("RAG flow: ingest docs → split → embed → store; at query time embed the question, retrieve top-k similar chunks (threshold-filtered), inject as trusted context, instruct the model to answer **only** from it. This is how a bank answers fee/policy questions without hallucination — pgvector means no new infrastructure."),
H("Tool calling: the model uses your APIs"),
CODE("ai_tools","java","@Tool methods with authorization preserved"),
CALL("warn","The model is not a security boundary","Tool calls must re-check the CALLER's permissions (ToolContext carries customerId). Validate model-supplied arguments like user input. Make tools read-mostly and idempotent: a confused model retrying must not double-charge anyone."),
H("Streaming, ops, security"),
CODE("ai_stream","java","SSE streaming + timeout/budget discipline"),
CODE("ai_secure","java","prompt injection defence + evals in CI"),
CALL("prod","Production rules for AI features","AI is advisory: money flows never block on a model call; degrade to canned responses on outage. Mask PII before prompts; audit every interaction (user, prompt hash, model, tokens, cost); track cost via usage metadata; run golden-question evals in CI so upgrades don't silently regress; feature-flag new prompts like code."),
QA([
{q:"ChatModel vs ChatClient?",a:"ChatModel is the low-level provider driver (JdbcTemplate-like); ChatClient is the fluent facade (WebClient-like) adding advisors, tools, memory, converters. Build once via ChatClient.Builder, reuse."},
{q:"How does RAG reduce hallucination?",a:"The model answers from retrieved, trusted chunks of YOUR documents instead of training memory; similarity threshold + 'answer only from context' + citing sources keeps it honest."},
{q:"What is prompt injection and how do you defend?",a:"User text tries to override instructions ('ignore previous rules'). Defend by isolating untrusted input (DATA markers), refusing out-of-scope in the system prompt, validating outputs against retrieved context, and eval tests asserting refusals."},
{q:"Ollama vs OpenAI in this stack?",a:"Same Spring AI API, different starter + base URL: Ollama runs models locally (dev, privacy), OpenAI/Azure for frontier quality. Swap via configuration; keep prompts provider-agnostic where possible."}])
]},

  if(e.key==='Escape'){$('#search').value='';$('#sidebar').innerHTML=sidebarHTML('');document.body.classList.remove('navopen');$('#search').blur();}
  if(e.key===']'&&current!=='overview'){var i=FLAT.indexOf(current);if(i>-1&&i<FLAT.length-1)render(FLAT[i+1]);}
  if(e.key==='['&&current!=='overview'){var j=FLAT.indexOf(current);if(j>0)render(FLAT[j-1]);}
});
render('overview');
window.__bf_booted=true;
</script>
